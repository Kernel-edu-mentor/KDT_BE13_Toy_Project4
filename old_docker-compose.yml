name: edumentor

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: edumentor-postgres
    environment:
      POSTGRES_DB: edumentor
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d edumentor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edumentor-network

  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:latest
    container_name: edumentor-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - edumentor-network

  # Python AI Server (통합)
  python-server:
    build:
      context: ./python-server
      dockerfile: Dockerfile
    container_name: edumentor-python
    ports:
      - "8000:8000"
    env_file:
      - ./python-server/.env
    environment:
      - UPSTAGE_API_KEY=${UPSTAGE_API_KEY}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATABASE_URL=postgresql://admin:password@postgres:5432/edumentor
      - SHARED_UPLOAD_DIR=/app/shared/uploads
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-edumentor}
    depends_on:
      chromadb:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - shared-uploads:/app/shared/uploads  # ✨ 공유 볼륨 마운트
    networks:
      - edumentor-network

  # Spring Boot Backend
  spring-backend:
    build:
      context: ./spring-server/paper
      dockerfile: Dockerfile
    container_name: edumentor-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/edumentor
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=password
      - PYTHON_AI_SERVICE_URL=http://python-server:8000
      - FILE_UPLOAD_DIR=/app/shared/uploads  # 공유 디렉토리 경로
    depends_on:
      postgres:
        condition: service_healthy
      python-server:
        condition: service_started
    volumes:
      - shared-uploads:/app/shared/uploads  # ✨ 공유 볼륨 마운트 (Python과 동일)
    networks:
      - edumentor-network

# React/TSX Frontend (개발 모드)
  frontend:
    build:
      context: ./404-NOT-FOUND-Frontend
      dockerfile: Dockerfile.dev # ⬅️ 개발용 Dockerfile 사용
    container_name: edumentor-frontend
    ports:
      - "3000:3000"  # 로컬 3000번 포트를 컨테이너의 3000번 포트에 연결
    volumes:
      # ⬅️ 중요: 소스 코드 마운트
      - ./404-NOT-FOUND-Frontend:/app
      # ⬅️ node_modules를 호스트에서 격리하여 충돌 방지
      - /app/node_modules
    environment:
      # 개발 서버 설정에 필요한 환경 변수 (필요한 경우 추가)
      - NODE_ENV=development
    depends_on:
      spring-backend:
        condition: service_started
    networks:
      - edumentor-network

volumes:
  postgres_data:
    name: edumentor_postgres_data
  chroma_data:
    name: edumentor_chroma_data
  shared-uploads:  # ✨ 신규 추가: 파일 공유를 위한 볼륨
    name: edumentor_shared_uploads

networks:
  edumentor-network:
    name: edumentor-network
    driver: bridge