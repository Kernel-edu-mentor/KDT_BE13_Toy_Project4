# Kakao OAuth
spring:
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:8895a2ddc4885c7ded353d9a4b5dc7fa}
            client-secret: ${KAKAO_CLIENT_SECRET:5hi82QnpRiYWdNlyOskQ1w4TZW9Glhr4}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id  # Kakao는 'id'를 기본 키로 사용

front:
  redirect-uri: http://localhost:4000/dashboard
#  rest-api-key: 8895a2ddc4885c7ded353d9a4b5dc7fa
#  client-secret: 5hi82QnpRiYWdNlyOskQ1w4TZW9Glhr4
#  token-url: https://kauth.kakao.com/oauth/token
#  user-info-url: https://kapi.kakao.com/v2/user/me