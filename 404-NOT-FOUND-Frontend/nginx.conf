server {
    listen 80;
    
    # 루트 디렉토리 설정 (정적 파일이 있는 위치)
    root /usr/share/nginx/html;
    index index.html;

    # 싱글 페이지 애플리케이션 (SPA) 라우팅 처리
    # 존재하지 않는 경로로 접속해도 index.html을 반환하여 React Router 등이 처리하도록 함
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 캐시 설정 (필요에 따라 추가)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        log_not_found off;
    }

    # API 프록시 설정 (선택 사항)
    # location /api/ {
    #     proxy_pass http://backend-server:8080/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}